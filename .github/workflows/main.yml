name: Crear APK SayCheese

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar archivos del ZIP
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o "$z" -d .; done
          FOUND=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          if [ -n "$FOUND" ]; then
            DIR=$(dirname "$FOUND")
            cp "$DIR/pubspec.yaml" /tmp/pubspec.yaml
            cp "$DIR/lib/main.dart" /tmp/main.dart
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Crear Android y compilar APK
        run: |
          flutter create --platforms=android --org com.saycheese.agent --project-name saycheese_agent .
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/><uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"\/><application/' "$MANIFEST"
          flutter pub get
          flutter build apk --release

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SayCheese-Agent-APK
          path: build/app/outputs/flutter-apk/app-release.apk
